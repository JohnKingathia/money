 return `<div class="card"><div class="mute">Net worth</div><div class="big">KES ${fmt(nw)}</div><div class="mute">Assets KES ${fmt(as)}${ow?' · Loans owed KES '+fmt(ow):''}</div></div>

function txGroups(L){const g={},add=(k,o)=>{const r=g[k]=g[k]||{k,out:0,in:0,mv:0,n:0};r.out+=o.out||0;r.in+=o.in||0;r.mv+=o.mv||0;r.n++};
 L.forEach(t=>{const x=t.Amount,e=t.Type=='Expense',tr=t.Type=='Transfer';
  if(TF.grp=='cat'){if(e)add(t.Category||'No category',{out:x});else if(t.Type=='Income')add('Income: '+(t.Category||'Income'),{in:x})}
  else if(TF.grp=='acc'){if(tr){add(t.Account,{out:x});add(t.ToAccount,{in:x})}else add(t.Account,e?{out:x}:{in:x})}
  else if(TF.grp=='type')add(t.Type,tr?{mv:x}:e?{out:x}:{in:x});
  else add(t.By||'Unknown',tr?{mv:x}:e?{out:x}:{in:x})});
 return Object.values(g).sort((a,b)=>(b.out+b.in+b.mv)-(a.out+a.in+a.mv))}

 return `<div class="grid"><div class="card"><div class="mute">Money out</div><b class="neg">KES ${fmt(out)}</b></div><div class="card"><div class="mute">Money in</div><b class="pos">KES ${fmt(inn)}</b></div></div>${mv?`<p class="mute" style="margin:8px 0 0">Moved between your own accounts: KES ${fmt(mv)}</p>`:''}
<h2>Summary by</h2><div class="seg">${[['cat','Category'],['acc','Account'],['type','Type'],['by','Person']].map(x=>`<button class="${TF.grp==x[0]?'on':''}" onclick="tfGrp('${x[0]}')">${x[1]}</button>`).join('')}</div>

<h2>Entries (${L.length})</h2>${Object.keys(days).sort().reverse().map(d=>`<div class="dh">${dm(d)}</div><div class="card">${days[d].map(txHTML).join('')}</div>`).join('')||'<div class="card mute">No entries match.</div>'}`}

async function loadR(){bar(1);try{RD=await call('report',R)}catch(e){toast(e.message,'err')}bar(0);draw()}

const ins=d=>{const o=[],n=d.active;d.cats.forEach(c=>{const sg=Math.ceil(c.avgSpent*1.05/100)*100;
 if(!c.budgetedMonths&&c.avgSpent>0)o.push(['near',`${c.category}: averaging KES ${fmt(c.avgSpent)} a month with no budget. Consider budgeting about KES ${fmt(sg)}.`]);
 else if(c.budgetedMonths&&c.avgSpent>c.avgBudget*1.05)o.push(['over',`${c.category}: averaging KES ${fmt(c.avgSpent)} against a KES ${fmt(c.avgBudget)} budget (over in ${c.overMonths} of ${c.budgetedMonths} months). A budget near KES ${fmt(sg)} is more realistic.`]);
 else if(c.budgetedMonths&&c.avgBudget>0&&c.avgSpent<c.avgBudget*.75)o.push(['ok',`${c.category}: averaging KES ${fmt(c.avgSpent)} against KES ${fmt(c.avgBudget)}. You could trim about KES ${fmt(c.avgBudget-sg)} and move it to savings.`])});
 const inc=sum(d.months,'income'),sa=sum(d.months,'saved');if(inc>0)o.push([sa/inc>=.1?'ok':'near',`You saved ${Math.round(sa/inc*100)}% of income across ${n} month${n>1?'s':''}.${sa/inc<.1?' A common target is 10% or more.':''}`]);
 return o.map(x=>`<div class="al ${x[0]}">${esc(x[1])}</div>`).join('')||'<div class="card mute">Nothing stands out yet. More months give better insights.</div>'};
V.trends=()=>{const spans=[['Q1','Q1'],['Q2','Q2'],['H1','Mid-year'],['Q3','Q3'],['Q4','Q4'],['H2','2nd half'],['Y','Full year']];
 const head=`<h1>Trends</h1><div class="mo" style="margin-top:10px"><button onclick="rs('year',R.year-1)">‹</button><b style="font-size:20px">${R.year}</b><button onclick="rs('year',R.year+1)">›</button></div><div class="chips" style="margin-bottom:14px">${spans.map(s=>`<button class="chip ${R.span==s[0]?'on':''}" onclick="rs('span','${s[0]}')">${s[1]}</button>`).join('')}</div>`;
 if(!RD)return head+'<div class="card mute">Loading…</div>';

 return head+`<div class="grid"><div class="card"><div class="mute">Income</div><b class="pos">KES ${fmt(inc)}</b></div><div class="card"><div class="mute">Spent</div><b class="neg">KES ${fmt(sp)}</b></div><div class="card"><div class="mute">Saved to funds</div><b>KES ${fmt(sa)}</b></div><div class="card"><div class="mute">Interest</div><b>KES ${fmt(it)}</b></div><div class="card"><div class="mute">Average spend a month</div><b>KES ${fmt(sp/n)}</b></div><div class="card"><div class="mute">Savings rate</div><b>${inc?Math.round(sa/inc*100):0}%</b></div></div>
${sp>0&&RD.groups&&RD.groups.length?`<h2>Where the money goes</h2><div class="card">${RD.groups.map(g=>`<div style="margin-bottom:10px"><div class="row"><b>${esc(g.group)}</b><span class="mute">${fmt(g.total)} · ${Math.round(g.total/sp*100)}%</span></div><div class="bar"><i style="background:var(--brand);width:${Math.min(100,g.total/sp*100)}%"></i></div></div>`).join('')}</div>`:''}
<h2>Month by month</h2><div class="card">${m.map(x=>`<div style="margin-bottom:10px"><div class="row"><b>${nice(x.month).split(' ')[0]}</b><span class="mute">${fmt(x.income)} in · ${fmt(x.spent)} out</span></div><div class="bar" style="margin:4px 0"><i style="background:var(--ok);width:${x.income/mx*100}%"></i></div><div class="bar" style="margin:0"><i style="background:var(--over);width:${x.spent/mx*100}%"></i></div></div>`).join('')}</div>
<h2>What this suggests</h2>${n<3?`<p class="mute">Based on ${n} month${n>1?'s':''} so far. Insights get sharper with more.</p>`:''}${ins(RD)}
<h2>Categories: average a month</h2><div class="card">${RD.cats.map(c=>`<div class="tx"><div><b>${esc(c.category)}</b><div class="mute">budget ${c.budgetedMonths?fmt(c.avgBudget):'none'} · over in ${c.overMonths} of ${c.budgetedMonths} months</div></div><b>${fmt(c.avgSpent)}</b></div>`).join('')}</div>`};
